name: Check Nscale jobs
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay by a few minutes)
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_jobs.py
      - name: Save seen jobs
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || (git commit -m "update seen jobs" && git push)
